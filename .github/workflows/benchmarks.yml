name: Benchmarks

on:
  pull_request:
    paths:
      - .github/actions/setup-nix/**
      - .github/workflows/benchmarks.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - flake.lock
      - flake.nix
  workflow_dispatch:
    inputs:
      base:
        description: Baseline revision
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CACHIX_NAME: hakula
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Benchmark Reports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: head
          fetch-depth: 0

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
          persist-credentials: false
          path: base

      - name: Select branch baseline
        if: github.event_name == 'pull_request'
        run: |
          baseline=$(git -C head merge-base HEAD "$(git -C base rev-parse HEAD)")
          git -C base fetch --no-tags --depth=1 origin "$baseline"
          git -C base checkout --detach FETCH_HEAD

      - name: Set up Nix
        uses: ./head/.github/actions/setup-nix

      - name: Cache benchmark builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            base -> ../target/base
            head -> ../target/head
          key: ${{ hashFiles('head/flake.nix', 'head/flake.lock') }}
          cmd-format: nix develop "${{ github.workspace }}/head" -c {0}

      - name: Record benchmark environment
        run: |
          mkdir -p results
          {
            git -C base show -s --format='Base: %H'
            git -C head show -s --format='Head: %H'
            nix develop ./head -c rustc -V
            lscpu
          } > results/environment.txt

      - name: Compile both revisions
        run: |
          for revision in base head; do
            (
              cd "$revision"
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/$revision" \
                nix develop "$GITHUB_WORKSPACE/head" -c \
                cargo bench --locked --bench performance --no-run
            ) 2>&1 | tee "results/compile-$revision.log"
          done

      - name: Measure base and head
        run: |
          for revision in base head; do
            mkdir -p "results/$revision"
            (
              cd "$revision"
              CRITERION_HOME="$GITHUB_WORKSPACE/results/$revision/criterion" \
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/$revision" \
                nix develop "$GITHUB_WORKSPACE/head" -c \
                cargo bench --bench performance -- \
                --color never --save-baseline measured
            ) 2>&1 | tee "results/measure-$revision.log"
          done

      - name: Summarize benchmark results
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Both revisions ran their own benchmark harness. The benchmark-results artifact contains separate Criterion reports, raw samples, measurement logs, and environment details.

          Review workload inputs and timing boundaries before comparing results. Shared-runner timings are advisory.
          EOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: results/
          if-no-files-found: ignore
          retention-days: 14
