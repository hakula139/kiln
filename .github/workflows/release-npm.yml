name: Release npm

on:
  push:
    tags: ['css-v[0-9]+.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/css
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release version
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$GITHUB_REF_NAME" == "css-v$version" ]]

      - name: Install dependencies
        run: npm ci

      - name: Publish Tailwind processor
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi
