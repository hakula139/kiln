name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libdav1d (Linux)
        # Required by the `image` crate's `avif-native` decoder via dav1d-sys.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev nasm

      - name: Install libdav1d (macOS)
        if: runner.os == 'macOS'
        run: brew install dav1d nasm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kiln
          target: ${{ matrix.target }}
          tar: unix
          zip: none
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
