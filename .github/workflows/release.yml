name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  pull_request:
    paths:
      - .github/actions/setup-avif/**
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - crates/kiln/Cargo.toml
      - crates/kiln/tests/fixtures/example.avif
      - npm/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform.target }}, ${{ matrix.variant.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: base
            features: ''
            archive: kiln
          - name: extended
            features: avif
            archive: kiln-extended
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up AVIF
        uses: ./.github/actions/setup-avif
        with:
          enabled: ${{ matrix.variant.name == 'extended' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant.name }}

      - name: Build archive
        id: binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kiln
          archive: ${{ matrix.variant.archive }}-$target
          features: ${{ matrix.variant.features }}
          target: ${{ matrix.platform.target }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant.archive }}-${{ matrix.platform.target }}
          path: |
            ${{ steps.binary.outputs.tar }}
            ${{ steps.binary.outputs.zip }}
            ${{ steps.binary.outputs.sha256 }}
          if-no-files-found: error
          overwrite: true

  package-npm:
    name: Package npm
    outputs:
      version: ${{ steps.package.outputs.version }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          pattern: kiln-*
          path: release-assets
          merge-multiple: true

      - name: Pack npm packages
        id: package
        run: |
          node npm/package.mjs release-assets npm-packages
          version=$(node -p "require('./npm-packages/kiln/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error
          overwrite: true

  test-npm:
    name: Test npm (${{ matrix.platform.runner }})
    needs: package-npm
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            package: linux-x64-gnu
          - runner: macos-latest
            package: darwin-arm64
          - runner: windows-latest
            package: win32-x64-msvc
    env:
      VERSION: ${{ needs.package-npm.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up AVIF
        uses: ./.github/actions/setup-avif
        with:
          enabled: true

      - name: Download npm packages
        uses: actions/download-artifact@v7
        with:
          name: npm-packages
          path: npm-packages

      - name: Install and run both variants
        shell: bash
        run: |
          for variant in kiln kiln-extended; do
            npm install --prefix "npm-$variant" --offline --ignore-scripts --no-audit --no-fund \
              "./npm-packages/kiln-ssg-$variant-$VERSION.tgz" \
              "./npm-packages/kiln-ssg-$variant-${{ matrix.platform.package }}-$VERSION.tgz"
            PATH="$PWD/npm-$variant/node_modules/.bin:$PATH" kiln --version
          done

  publish:
    name: Publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          pattern: kiln-*
          path: release-assets
          merge-multiple: true

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parse-changelog CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md
          options=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${options[@]}"

  publish-npm:
    name: Publish npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download npm packages
        uses: actions/download-artifact@v7
        with:
          name: npm-packages
          path: npm-packages

      - name: Publish native packages and launchers
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            tag=next
          fi
          for package in npm-packages/*-{darwin-arm64,linux-x64-gnu,win32-x64-msvc}-*.tgz; do
            npm publish "$package" --access public --tag "$tag"
          done
          for variant in kiln kiln-extended; do
            npm publish "npm-packages/kiln-ssg-$variant-${GITHUB_REF_NAME#v}.tgz" --access public --tag "$tag"
          done
