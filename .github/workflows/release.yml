name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - crates/kiln/Cargo.toml
      - crates/kiln/tests/fixtures/example.avif
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: ${{ matrix.variant.name }} (${{ matrix.platform.target }})
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: base
            features: ""
            archive: kiln
          - name: extended
            features: avif
            archive: kiln-extended
        platform:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libdav1d (Linux)
        if: matrix.variant.name == 'extended' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev

      - name: Install libdav1d (macOS)
        if: matrix.variant.name == 'extended' && runner.os == 'macOS'
        run: brew install dav1d

      - name: Install libdav1d (Windows)
        # vcpkg ships dav1d; pkgconfiglite lets `system-deps` read its .pc files.
        if: matrix.variant.name == 'extended' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress pkgconfiglite
          vcpkg install dav1d:x64-windows-static-md
          $vcpkgInstalled = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          "PKG_CONFIG_PATH=$vcpkgInstalled\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build and upload binary
        id: binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kiln
          archive: ${{ matrix.variant.archive }}-$target
          features: ${{ matrix.variant.features }}
          target: ${{ matrix.platform.target }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          dry-run: ${{ github.event_name == 'pull_request' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload validation archive
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant.archive }}-${{ matrix.platform.target }}
          path: |
            ${{ steps.binary.outputs.tar }}
            ${{ steps.binary.outputs.zip }}
            ${{ steps.binary.outputs.sha256 }}
          if-no-files-found: error
