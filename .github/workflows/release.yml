name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  pull_request:
    paths:
      - .github/actions/setup-avif/**
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - crates/kiln/Cargo.toml
      - crates/kiln/tests/fixtures/example.avif
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.platform.target }}, ${{ matrix.variant.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: base
            features: ''
            archive: kiln
          - name: extended
            features: avif
            archive: kiln-extended
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up AVIF
        uses: ./.github/actions/setup-avif
        with:
          enabled: ${{ matrix.variant.name == 'extended' }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant.name }}

      - name: Build archive
        id: binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kiln
          archive: ${{ matrix.variant.archive }}-$target
          features: ${{ matrix.variant.features }}
          target: ${{ matrix.platform.target }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant.archive }}-${{ matrix.platform.target }}
          path: |
            ${{ steps.binary.outputs.tar }}
            ${{ steps.binary.outputs.zip }}
            ${{ steps.binary.outputs.sha256 }}
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          pattern: kiln-*
          path: release-assets
          merge-multiple: true

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parse-changelog CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md
          options=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${options[@]}"
