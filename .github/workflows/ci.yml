name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CACHIX_NAME: hakula
  CARGO_TERM_COLOR: always

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run flake check
        run: nix flake check

  node-check:
    name: Node Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Format
        run: nix develop -c pnpm format

      - name: Lint
        run: nix develop -c pnpm lint

      - name: Test npm packaging
        run: nix develop -c pnpm test

      - name: Spell check
        run: nix develop -c pnpm spellcheck

  rust-check:
    name: Rust Check (${{ matrix.runner }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: base
            features: ''
          - runner: ubuntu-latest
            variant: extended
            features: avif
          - runner: windows-latest
            variant: base
            features: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up AVIF
        uses: ./.github/actions/setup-avif
        with:
          enabled: ${{ matrix.variant == 'extended' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install CSS processor
        run: npm install --global @kiln-ssg/tailwindcss@0.1.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --features "${{ matrix.features }}" -- -D warnings

      - name: Test
        run: cargo test --features "${{ matrix.features }}"

      - name: Test benchmark workloads
        run: cargo test --bench performance --features "${{ matrix.features }}"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: nix develop -c cargo llvm-cov --locked --all-features --ignore-filename-regex 'main\.rs' --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  nix-build:
    name: Nix Build (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    strategy: &nix-platforms
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            cachix_pins:
              kiln-main-x86_64-linux: .#kiln
              pagefind-main-x86_64-linux: .#pagefind
          - runner: macos-latest
            cachix_pins:
              kiln-main-aarch64-darwin: .#kiln
              pagefind-main-aarch64-darwin: .#pagefind
    env:
      CACHIX_PINS: ${{ toJSON(matrix.platform.cachix_pins) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build packages
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$CACHIX_PINS" |
            nix build --stdin --no-link --print-build-logs

      - name: Push main builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$CACHIX_PINS" |
            nix path-info --stdin |
            cachix push "$CACHIX_NAME"

  pin-main:
    name: Pin Main Builds (${{ matrix.platform.runner }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flake-check, nix-build, node-check, rust-check]
    runs-on: ${{ matrix.platform.runner }}
    strategy: *nix-platforms
    concurrency:
      group: kiln-main-pin-${{ matrix.platform.runner }}
      queue: max
    env:
      CACHIX_PINS: ${{ toJSON(matrix.platform.cachix_pins) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Restore builds from cache
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$CACHIX_PINS" |
            nix build --stdin --no-link --max-jobs 0 --print-build-logs

      - name: Pin current main builds
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$CACHIX_PINS" |
            while IFS=$'\t' read -r pin_name package; do
              store_path=$(nix path-info "$package")
              main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
              test -n "$main_sha"
              if [ "$GITHUB_SHA" != "$main_sha" ]; then
                echo "Skipping pins for an older main commit."
                exit 0
              fi
              cachix pin "$CACHIX_NAME" "$pin_name" "$store_path" --keep-revisions 2
            done
