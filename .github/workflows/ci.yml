name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CACHIX_NAME: hakula
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  nix:
    uses: hakula139/devkit/.github/workflows/nix.yml@v3
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  rust:
    permissions:
      contents: read
      id-token: write
    uses: hakula139/devkit/.github/workflows/rust.yml@v3
    with:
      all_features: true
      msrv: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  variants:
    name: Variant Check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}

      - name: Run base clippy
        run: |
          nix develop -c cargo clippy \
            --locked \
            --all-targets

      - name: Run base tests
        run: nix develop -c cargo test --locked

      - name: Test benchmark workloads
        run: |
          nix develop -c cargo test \
            --locked \
            --bench performance

          nix develop -c cargo test \
            --locked \
            --bench performance \
            --all-features

  windows:
    name: Windows Check (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            features: ''
          - variant: extended
            features: avif

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up AVIF
        if: matrix.variant == 'extended'
        uses: ./.github/actions/setup-avif

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install build tools
        run: npm install --global @kiln-ssg/tailwindcss@0.1.6 pagefind@1.5.2

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - name: Run clippy
        run: |
          cargo clippy \
            --locked \
            --all-targets \
            --features "${{ matrix.features }}"

      - name: Run tests
        run: |
          cargo test \
            --locked \
            --features "${{ matrix.features }}"

      - name: Test benchmark workloads
        run: |
          cargo test \
            --locked \
            --bench performance \
            --features "${{ matrix.features }}"

  pin-main:
    name: Pin Main Builds (${{ matrix.platform.runner }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [nix, rust, variants, windows]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            cachix_pin: kiln-main-x86_64-linux
          - runner: macos-latest
            cachix_pin: kiln-main-aarch64-darwin
    concurrency:
      group: kiln-main-pin-${{ matrix.platform.runner }}
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3

      - name: Restore build from cache
        run: |
          nix build .#kiln \
            --no-link \
            --max-jobs 0 \
            --print-build-logs

      - name: Pin current main build
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_PIN: ${{ matrix.platform.cachix_pin }}
        run: |
          set -euo pipefail

          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$main_sha"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Skipping the pin for an older main commit."
            exit 0
          fi

          cachix pin "$CACHIX_NAME" "$CACHIX_PIN" "$(nix path-info .#kiln)" --keep-revisions 2

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [nix, rust, variants, windows, pin-main]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: Check results
        uses: hakula139/devkit/.github/actions/ci-result@v3
