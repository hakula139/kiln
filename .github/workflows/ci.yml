name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CACHIX_NAME: hakula
  CARGO_TERM_COLOR: always

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run flake check
        run: nix flake check

  node-check:
    name: Node Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Format
        run: nix develop -c pnpm format

      - name: Lint
        run: nix develop -c pnpm lint

      - name: Spell check
        run: nix develop -c pnpm spellcheck

  rust-check:
    name: Rust Check (${{ matrix.runner }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: base
            features: ''
          - runner: ubuntu-latest
            variant: extended
            features: avif
          - runner: windows-latest
            variant: base
            features: ''
          - runner: windows-latest
            variant: extended
            features: avif
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up AVIF
        if: matrix.variant == 'extended'
        uses: ./.github/actions/setup-avif

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install build tools
        run: npm install --global @kiln-ssg/tailwindcss@0.1.3 pagefind@1.5.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --features "${{ matrix.features }}" -- -D warnings

      - name: Test
        run: cargo test --features "${{ matrix.features }}"

      - name: Test benchmark workloads
        run: cargo test --bench performance --features "${{ matrix.features }}"

  msrv-check:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up AVIF
        uses: ./.github/actions/setup-avif

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo hack check --rust-version --workspace --all-targets --all-features --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.nix', 'flake.lock') }}
          cmd-format: nix develop -c {0}

      - name: Generate coverage
        run: nix develop -c cargo llvm-cov --locked --all-features --ignore-filename-regex 'main\.rs' --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  nix-build:
    name: Nix Build (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    strategy: &nix-platforms
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            cachix_pin: kiln-main-x86_64-linux
          - runner: macos-latest
            cachix_pin: kiln-main-aarch64-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build package
        run: nix build .#kiln --no-link --print-build-logs

  pin-main:
    name: Pin Main Builds (${{ matrix.platform.runner }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flake-check, nix-build, node-check, rust-check]
    runs-on: ${{ matrix.platform.runner }}
    strategy: *nix-platforms
    concurrency:
      group: kiln-main-pin-${{ matrix.platform.runner }}
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Restore build from cache
        run: nix build .#kiln --no-link --max-jobs 0 --print-build-logs

      - name: Pin current main build
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_PIN: ${{ matrix.platform.cachix_pin }}
        run: |
          set -euo pipefail

          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$main_sha"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Skipping the pin for an older main commit."
            exit 0
          fi

          cachix pin "$CACHIX_NAME" "$CACHIX_PIN" "$(nix path-info .#kiln)" --keep-revisions 2
