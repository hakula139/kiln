name: Set up AVIF
description: Install dav1d for AVIF placeholder decoding

runs:
  using: composite
  steps:
    - name: Install dav1d (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libdav1d-dev

    - name: Install dav1d (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install dav1d

    - name: Compute vcpkg cache key (Windows)
      id: vcpkg-cache-key
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $image = if ($env:ImageVersion) { $env:ImageVersion } else { 'unknown' }
        "image=$image" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Cache vcpkg dav1d (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/vcpkg_cache
        key: >-
          vcpkg-dav1d-${{ runner.os }}-${{ runner.arch }}-${{
          steps.vcpkg-cache-key.outputs.image }}-${{
          hashFiles('.github/actions/setup-avif/**') }}

    - name: Install dav1d (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg_cache,readwrite
      run: |
        $installRoot = "$env:RUNNER_TEMP\vcpkg_installed"

        $maxAttempts = 3
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          vcpkg install `
            --triplet x64-windows-static-md `
            --x-manifest-root="$env:GITHUB_ACTION_PATH" `
            --x-install-root="$installRoot"
          if ($LASTEXITCODE -eq 0) {
            break
          }
          if ($attempt -eq $maxAttempts) {
            exit $LASTEXITCODE
          }
          Start-Sleep -Seconds (5 * $attempt)
        }

        $vcpkgInstalled = "$installRoot\x64-windows-static-md"
        @(
          "SYSTEM_DEPS_DAV1D_NO_PKG_CONFIG=1"
          "SYSTEM_DEPS_DAV1D_SEARCH_NATIVE=$vcpkgInstalled\lib"
          "SYSTEM_DEPS_DAV1D_LIB=dav1d"
          "SYSTEM_DEPS_DAV1D_LINK=static"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append
