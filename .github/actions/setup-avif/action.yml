name: Set up AVIF
description: Install dav1d for AVIF placeholder decoding

runs:
  using: composite
  steps:
    - name: Install dav1d (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libdav1d-dev

    - name: Install dav1d (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install dav1d

    - name: Install pkg-config (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install --no-progress pkgconfiglite
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
        Get-Command pkg-config -ErrorAction Stop | Out-Null

    - name: Install dav1d (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installRoot = "$env:RUNNER_TEMP\vcpkg_installed"
        vcpkg install `
          --triplet x64-windows-static-md `
          --x-manifest-root="$env:GITHUB_ACTION_PATH" `
          --x-install-root="$installRoot"
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        $vcpkgInstalled = "$installRoot\x64-windows-static-md"
        "PKG_CONFIG_PATH=$vcpkgInstalled\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
