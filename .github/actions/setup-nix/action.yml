name: Setup Nix
description: Install Nix and configure the Cachix substituter

inputs:
  cachix_name:
    description: Cachix cache name (defaults to CACHIX_NAME, skips Cachix if neither is set)
  cachix_auth_token:
    description: Upload token for main and maintainer runs (omit for read-only cache access)

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        # A single-user install cannot create the kernel namespaces the sandbox
        # needs, and `sandbox-fallback` would otherwise hide that by retrying a
        # failed sandbox setup without one.
        extra_nix_config: |
          sandbox = true
          sandbox-fallback = false

    - name: Setup Cachix
      if: ${{ inputs.cachix_name || env.CACHIX_NAME }}
      uses: cachix/cachix-action@v17
      with:
        name: ${{ inputs.cachix_name || env.CACHIX_NAME }}
        authToken: ${{ inputs.cachix_auth_token }}
        skipPush: ${{ !inputs.cachix_auth_token || !(github.ref == 'refs/heads/main' || github.actor == 'hakula139') }}
