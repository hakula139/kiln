name: Setup native dependencies
description: Build pinned static dav1d for native Rust builds

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install build tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm pkg-config

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install nasm pkg-config

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install --no-progress -y nasm pkgconfiglite
        "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Install Meson and Ninja
      shell: bash
      run: python -m pip install meson==1.10.2 ninja==1.13.0

    - name: Build dav1d
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: python "${{ github.action_path }}/../../scripts/build-dav1d.py"
