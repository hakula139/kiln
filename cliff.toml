# git-cliff configuration
# Reference: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

body = """

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | split(pat="-->") | last | trim | upper_first }}

    {% for commit in commits -%}
        - {% if commit.scope %}_({{ commit.scope }})_ {% endif -%}
          {{ commit.message | upper_first | trim }}
    {% endfor %}
{%- endfor -%}
"""

footer = """

{% for release in releases -%}
    {%- if release.version -%}
        {%- if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/hakula139/kiln/compare/{{ release.previous.version }}..{{ release.version }}
        {%- else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/hakula139/kiln/releases/tag/{{ release.version }}
        {%- endif -%}
    {%- else -%}
[unreleased]: https://github.com/hakula139/kiln/compare/{{ release.previous.version }}...HEAD
    {%- endif %}
{%- if not loop.last %}
{% endif -%}
{% endfor -%}
"""

# Strip per-line indentation from templates so layout above doesn't leak into output.
trim = true

# Postprocessors run per-template, so anchor-based newline trimming would eat
# the body / footer separator. Collapse runs of `\n{3,}` instead.
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
  # Trim Dependabot / Renovate verbose phrasing for `chore(deps)` commits.
  { pattern = ' in the [a-z]+ group(?: across \d+ director(?:y|ies))?', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
sort_commits = "oldest"

commit_preprocessors = [
  # Backtick inline HTML in subjects so markdown renders it as code. `(^|[^`])`
  # is a lookbehind stand-in (Rust regex lacks one) skipping already-fenced spans.
  { pattern = '(^|[^`])(<\/?[a-zA-Z][^>]*>)', replace = '$1`$2`' },
]

# `<!-- N -->` prefixes (stripped in the body template) order sections by priority.
# First match wins: catch-all `!:` → type prefixes → scope overrides → skips.
commit_parsers = [
  { message = '^[a-z]+(\([^)]+\))?!:', group = "<!-- 0 -->Breaking changes" },

  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Removed" },

  # Scope-specific overrides for types that would otherwise hit the skip rules below.
  { message = '^chore\(deps\)', group = "<!-- 5 -->Dependencies" },
  { message = '^ci\(release\)', group = "<!-- 1 -->Added" },

  { message = "^build", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^docs", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
]

[remote.github]
owner = "hakula139"
repo = "kiln"
