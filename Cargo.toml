[workspace]
members = ["crates/kiln"]
resolver = "3"

[workspace.package]
version = "0.5.0-alpha.1"
edition = "2024"
authors = ["Hakula <i@hakula.xyz>"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
csv = "1"
dunce = "1"
gh-emoji = "1"
hex = "0.4"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = [
  "avif-native",
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
imagesize = "0.15"
indoc = "2"
itertools = "0.15"
jiff = { version = "0.2", features = ["serde"] }
lightningcss = "1.0.0-alpha.72"
minify-html = "0.18"
minijinja = { version = "2", features = ["loader"] }
notify = "8"
open = "5"
oxc_allocator = "0.153"
oxc_codegen = "0.153"
oxc_minifier = "0.153"
oxc_parser = "0.153"
oxc_span = "0.153"
pathdiff = "0.2"
percent-encoding = "2"
pulldown-cmark = "0.13"
regex = "1"
reqwest = { version = "0.13", default-features = false }
scraper = { version = "0.27", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
syntect = { version = "5", default-features = false, features = [
  "html",
  "regex-onig",
] }
tempfile = "3"
tokio = { version = "1", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = "0.1"
tokio-tungstenite = "0.30"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "ansi",
] }
two-face = "0.5"
unicase = "2"
unicode-width = "0.2"
url = "2"
walkdir = "2"
webp = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
