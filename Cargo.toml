[workspace]
members = ["crates/kiln"]
resolver = "3"

[workspace.package]
version = "0.5.0-alpha.1"
edition = "2024"
rust-version = "1.89"
authors = ["Hakula <i@hakula.xyz>"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
csv = "1"
dunce = "1"
futures-util = { version = "0.3", default-features = false }
gh-emoji = "1"
hex = "0.4"
icu_normalizer = { version = "2", default-features = false, features = [
  "compiled_data",
] }
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "webp",
] }
imagesize = "0.15"
indoc = "2"
itertools = "0.15"
jiff = { version = "0.2", features = ["serde"] }
lightningcss = "1.0.0-alpha.72"
minijinja = { version = "2", features = ["loader"] }
notify = "8"
open = "5"
pathdiff = "0.2"
percent-encoding = "2"
pulldown-cmark = "0.13"
rayon = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false }
scraper = { version = "0.27", default-features = false }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
swc_common = "26"
swc_ecma_ast = "29"
swc_ecma_codegen = "32"
swc_ecma_minifier = "63"
swc_ecma_parser = "46"
swc_ecma_transforms_base = "50"
swc_ecma_visit = "29"
swc_html_ast = "26"
swc_html_codegen = "27"
swc_html_minifier = { version = "63", default-features = false, features = [
  "custom-css-minifier",
] }
swc_html_parser = "26"
syntect = { version = "5", default-features = false, features = [
  "html",
  "regex-onig",
] }
tempfile = "3"
tokio = { version = "1", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = "0.30"
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "ansi",
] }
two-face = "0.5"
unicase = "2"
unicode-width = "0.2"
url = "2"
walkdir = "2"
webp = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
